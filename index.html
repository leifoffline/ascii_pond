<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koi Pond</title>
<style>
  :root{
    --hairline:rgba(214,230,249,0.24);
    --text-bright:#f6f9fd;
    --text-mid:#c3d4e8;
    --text-dim:#9fb6d2;
    --plate:rgba(16,30,54,0.55);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1f4a66;overflow:hidden}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:crosshair;touch-action:none}
  canvas.is-grab{cursor:grabbing}
  .hud{position:fixed;font:11px/1 var(--mono);letter-spacing:0.04em;color:var(--text-mid);user-select:none}
  .hud-hint{top:24px;left:50%;transform:translateX(-50%);pointer-events:none;color:var(--text-mid);transition:opacity 1.2s ease;white-space:nowrap;
    padding:8px 12px;border-radius:999px;background:var(--plate)}
  .hud-hint.is-gone{opacity:0}
  .hud-group{bottom:20px;display:flex;align-items:center;gap:6px}
  .hud-left{left:20px}
  .hud-right{right:20px}
  .hud button{height:28px;min-width:28px;border-radius:8px;border:1px solid var(--hairline);background:var(--plate);
    color:var(--text-mid);font:11px/1 var(--mono);letter-spacing:0.04em;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px;
    transition:color .15s ease,border-color .15s ease,background .15s ease}
  .hud button.sq{width:28px;padding:0;font-size:12px}
  .hud button:hover{color:var(--text-bright);border-color:rgba(214,230,249,0.5)}
  .hud button[aria-pressed="true"]{color:var(--text-bright);border-color:rgba(214,230,249,0.6);background:rgba(120,160,220,0.28)}
  .hud button:focus-visible{outline:1px solid var(--text-bright);outline-offset:3px}
  .hud output{min-width:50px;text-align:center;color:var(--text-bright)}
  @media (max-width:760px){.hud-hint{font-size:10px;top:14px;white-space:normal;text-align:center;line-height:1.5;width:max-content;max-width:calc(100vw - 32px);border-radius:14px}.hud-group{bottom:14px}.hud-left{left:12px}.hud-right{right:12px}}
</style>
</head>
<body>
<canvas id="cv" aria-label="An animated koi pond drawn in glowing characters, seen from above: koi under the surface, lily pads, ducks, reeds and a blossoming branch. Scroll or pinch to zoom, drag to pan, click the water to feed the koi."></canvas>
<div class="hud hud-hint" id="hint">scroll or pinch to zoom · drag to pan · click the water to feed the koi</div>
<div class="hud hud-group hud-left">
  <button type="button" class="sq" id="zout" aria-label="Zoom out">&minus;</button>
  <output id="zval" aria-live="polite">&times;1.00</output>
  <button type="button" class="sq" id="zin" aria-label="Zoom in">+</button>
  <button type="button" id="zreset">reset</button>
</div>
<div class="hud hud-group hud-right">
  <button type="button" id="rain" aria-pressed="false">rain</button>
  <button type="button" id="tod" aria-label="Time of day. Click to change.">auto · day</button>
</div>
<script>
(function(){
/* Koi pond.
   The pond lives in world space and the screen is a fixed grid of character
   cells that samples it through a camera, so zooming in puts more characters
   on each thing rather than enlarging them.

   Depth comes from stacking: a pebbled floor, koi in mid-water, the surface
   (pads, ducks, petals, ripples), and the air above it (reeds, a blossoming
   branch, dragonflies, fireflies, birds). Each depth is sampled with a small
   parallax offset that follows the pointer and the camera, and anything under
   the surface is also displaced by the slope of the ripples above it, so the
   water refracts what's beneath. The floor is drawn out of focus, the koi
   soft, the surface crisp with a glow.

   One bright ink per kind of thing; brightness is alpha, and it picks the
   glyph: denser characters for brighter cells, and along an edge a stroke
   (- / | \) that follows the outline. The palette is a blend of four times
   of day. */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const MONO=getComputedStyle(document.documentElement).getPropertyValue('--mono').trim()||'monospace';
const FILL=['.','\u00b7',':','-','+','o','0','#'];
const HOT=['o','0','O','8','0','o','@','0'];
const EDGE=['-','\\','|','/'];
const GLYPHS=[...new Set([...FILL,...HOT,...EDGE,'*',"'"])];
const STEP_EVERY=2,DAMP=0.965,RISE=0.22,FALL=0.1,FSP=0.42,DSP=0.26,ZMIN=1,ZMAX=6;
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const contrast=b=>b<0.15?b*0.6:Math.min(1,0.09+(b-0.15)*1.25);
const turnTo=(a,want,k)=>a+Math.atan2(Math.sin(want-a),Math.cos(want-a))*k;
const smooth=(a,b,x)=>{const q=Math.max(0,Math.min(1,(x-a)/(b-a)));return q*q*(3-2*q);};
const hash=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);};
function vnoise(x,y){const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const a=hash(x0,y0),b=hash(x0+1,y0),c=hash(x0,y0+1),d=hash(x0+1,y0+1);return (a+(b-a)*ux)+((c+(d-c)*ux)-(a+(b-a)*ux))*uy;}
let SU=0;
function segd(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy||1e-6;let q=((px-ax)*dx+(py-ay)*dy)/l;q=q<0?0:q>1?1:q;SU=q;return Math.hypot(px-ax-dx*q,py-ay-dy*q);}
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;}

/* ─── palette: four times of day, blended ─── */
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixc=(a,b,q)=>[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q,a[2]+(b[2]-a[2])*q];
const css=c=>'rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')';
const INK={water:0,cream:1,peach:2,mint:3,sage:4,apricot:5,white:6,lavender:7,bank:8,pink:9,bark:10,stone:11,firefly:12,aqua:13};
const BASE=['#bfe3ea','#f6efe4','#ec966f','#a9d6ae','#b2cf9c','#f2aa5e','#fbf8f3','#cdd0ea','#a5c2a8','#f2c6d0','#c79e80','#9fc0cc','#fff2b8','#b8e6ee'].map(hex);
function phase(bg,vig,water,stone,tint,amt,gain){
  return{bg:bg.map(hex),vig:hex(vig),gain,ink:BASE.map((c,i)=>i===0?hex(water):i===11?hex(stone):i===12?c:mixc(c,hex(tint),amt))};
}
const PHASES=[
  phase(['#2e6a8c','#225475','#173d5e'],'#0a1f33','#bfe3ea','#9fc0cc','#ffffff',0,1),
  phase(['#5f7198','#45597f','#2b3f5f'],'#141a33','#f4d6de','#b4b8d8','#ffc9d4',0.2,1.1),
  phase(['#173d5c','#0f2e48','#081e32'],'#020b17','#9cc6dc','#7699b2','#93b8e0',0.34,1.4),
  phase(['#7fa6c2','#5c86a8','#3d6487'],'#172c46','#f3e3e2','#b3cad8','#ffe6d0',0.14,1.05)
];
const PNAME=['day','dusk','night','dawn'];
const HOLD=60,BLEND=25;
let todMode='auto',todClock=0,wv=[1,0,0,0],baked=[-1,0,0,0],pal=null;
function blendPal(){
  const p={bg:[[0,0,0],[0,0,0],[0,0,0]],vig:[0,0,0],gain:0,ink:BASE.map(()=>[0,0,0])};
  for(let k=0;k<4;k++){const w=wv[k],P=PHASES[k];if(w<1e-4)continue;
    for(let j=0;j<3;j++)for(let c=0;c<3;c++)p.bg[j][c]+=P.bg[j][c]*w;
    for(let c=0;c<3;c++)p.vig[c]+=P.vig[c]*w;
    p.gain+=P.gain*w;
    for(let i=0;i<BASE.length;i++)for(let c=0;c<3;c++)p.ink[i][c]+=P.ink[i][c]*w;}
  return p;
}
function todFrame(dt){
  let tw=[0,0,0,0];
  if(todMode==='auto'){
    if(!reduce)todClock+=dt;
    const span=HOLD+BLEND,idx=Math.floor(todClock/span)%4,into=todClock%span,k=into<HOLD?0:smooth(0,1,(into-HOLD)/BLEND);
    tw[idx]=1-k;tw[(idx+1)%4]+=k;
  }else tw[todMode]=1;
  let sum=0;for(let k=0;k<4;k++){wv[k]+=(tw[k]-wv[k])*0.04;sum+=wv[k];}
  for(let k=0;k<4;k++)wv[k]/=sum;
  let diff=0;for(let k=0;k<4;k++)diff=Math.max(diff,Math.abs(wv[k]-baked[k]));
  if(diff>0.015)bake();
}
const todBtn=document.getElementById('tod');
function todLabel(){let m=0;for(let k=1;k<4;k++)if(wv[k]>wv[m])m=k;todBtn.textContent=todMode==='auto'?'auto \u00b7 '+PNAME[m]:PNAME[todMode];}
todBtn.onclick=()=>{
  if(todMode==='auto'){let m=0;for(let k=1;k<4;k++)if(wv[k]>wv[m])m=k;todMode=(m+1)%4;}
  else if(todMode===0)todMode='auto';
  else todMode=(todMode+1)%4;
  if(todMode==='auto')todClock=0;
  todLabel();
};

/* ─── state ─── */
let W,H,dpr,CELL,CW,CH,NC,sp,S,PX,PY,GW,GH,N,A,B,V,D,LAY,CAT,tex,SW,SPR,FS,sprites,sctxs;
let pads,fish,ducks,flyers,food,petals,dflies,fflies,L,FW,DL,DW,reeds,banks;
let deep,dctx,under,uctx,surf,sctx,h2,h4,h8,h2c,h4c,h8c,vign,vgc,bg,bgc;
let mouse=null,frame=0,lastT=0,rain=false,gHit=0,kCat=0,dCat=0,sCat=0,bCat=0,petalTimer=2;
let LS,stnx,stny,stx,sty,str,stb;
let brSegs,blossoms,brBox,brRoot,brReach,brDir;
let sgW,sgH,BSg,sGrid;
let Px=0,Py=0,tiltX=0,tiltY=0;
let GX,GY,NZ,camKey='',colS,colC,colW,rowS,rowC;
const cam={z:1,tz:1,cx:0,cy:0,anchor:null,pz:0,pcx:0,pcy:0,moving:true};

function init(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  /* S sizes things, PX/PY place them, so the pond keeps its proportions on any screen shape. */
  S=Math.sqrt(W*H/(680*422));PX=W/680;PY=H/422;
  sp=4.7*S;GW=Math.ceil(W/sp)+1;GH=Math.ceil(H/sp)+1;N=GW*GH;
  A=new Float32Array(N);B=new Float32Array(N);V=new Float32Array(N);GX=new Float32Array(N);GY=new Float32Array(N);

  deep=mk(W*dpr,H*dpr);dctx=deep.getContext('2d');dctx.setTransform(dpr,0,0,dpr,0,0);
  under=mk(W*dpr,H*dpr);uctx=under.getContext('2d');uctx.setTransform(dpr,0,0,dpr,0,0);
  surf=mk(W*dpr,H*dpr);sctx=surf.getContext('2d');sctx.setTransform(dpr,0,0,dpr,0,0);
  h2=mk(W/2,H/2);h2c=h2.getContext('2d');h4=mk(W/4,H/4);h4c=h4.getContext('2d');h8=mk(W/8,H/8);h8c=h8.getContext('2d');
  [h2c,h4c,h8c].forEach(c=>{c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';});
  vign=mk(W,H);vgc=vign.getContext('2d');bg=mk(W,H);bgc=bg.getContext('2d');

  L=78*S;FW=23*S;DL=34*S;DW=20*S;
  buildWorld();
  setGrid(Math.max(5,Math.min(7,W/235)));
  cam.z=cam.tz=1;cam.cx=W/2;cam.cy=H/2;cam.anchor=null;
}

/* The character grid can be rebuilt on its own, which is how the pond drops
   to a coarser grid on a slow machine. */
function setGrid(cell){
  CELL=cell;CW=Math.ceil(W/CELL);CH=Math.ceil(H/CELL);NC=CW*CH;
  D=new Float32Array(NC);LAY=new Uint8Array(NC);CAT=new Uint8Array(NC);tex=new Float32Array(NC);NZ=new Float32Array(NC);camKey='';
  colS=new Float64Array(CW);colC=new Float64Array(CW);colW=new Float64Array(CW);rowS=new Float64Array(CH);rowC=new Float64Array(CH);
  FS=CELL*1.42;SPR=Math.ceil(CELL*dpr)+2;SW=SPR/dpr;
  sprites=BASE.map(()=>{const set={};GLYPHS.forEach(ch=>{set[ch]=mk(SPR,SPR);});return set;});
  baked=[-1,0,0,0];bake();glGrid();
}
/* Draws one glyph centred in an SW-sized sprite whose top-left is the current origin. */
function stampGlyph(g,m,ch){
  g.font='500 '+FS+'px '+MONO;g.textBaseline='alphabetic';
  const mt=m.measureText(ch);
  g.fillText(ch,SW/2+((mt.actualBoundingBoxLeft||0)-(mt.actualBoundingBoxRight||mt.width))/2,SW/2+((mt.actualBoundingBoxAscent||FS*0.5)-(mt.actualBoundingBoxDescent||0))/2);
}
function bake(){
  baked=wv.slice();pal=blendPal();
  const m=mk(4,4).getContext('2d');m.font='500 '+FS+'px '+MONO;
  /* With the GPU path only the fireflies and rain still use the 2D sprites. */
  sprites.forEach((set,i)=>{if(gl&&i!==INK.firefly&&i!==INK.water)return;const col=css(pal.ink[i]);GLYPHS.forEach(ch=>{
    const c=set[ch],g=c.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,SPR,SPR);g.setTransform(dpr,0,0,dpr,0,0);
    g.fillStyle=col;stampGlyph(g,m,ch);
  });});
  if(gl){const f=new Float32Array(BASE.length*3);pal.ink.forEach((c,i)=>{for(let k=0;k<3;k++)f[i*3+k]=Math.round(c[k])/255;});gl.uniform3fv(glU.uInk,f);}
  let r=bgc.createRadialGradient(W*0.5,H*0.42,0,W*0.5,H*0.5,Math.hypot(W,H)*0.6);
  r.addColorStop(0,css(pal.bg[0]));r.addColorStop(0.55,css(pal.bg[1]));r.addColorStop(1,css(pal.bg[2]));bgc.fillStyle=r;bgc.fillRect(0,0,W,H);
  const v=pal.vig.map(Math.round).join(',');
  vgc.clearRect(0,0,W,H);r=vgc.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.hypot(W,H)*0.62);
  r.addColorStop(0,'rgba('+v+',0)');r.addColorStop(1,'rgba('+v+',0.55)');vgc.fillStyle=r;vgc.fillRect(0,0,W,H);
  todLabel();
}

/* ─── GPU glyph stamping ───
   Tens of thousands of drawImage calls a frame swamp the main thread, so when
   WebGL2 is available each layer's glyphs go out as one instanced draw from a
   white glyph atlas, tinted by ink in the shader, and the result is copied
   onto the same layer canvas the 2D path would have drawn into. */
const GI={};GLYPHS.forEach((c,k)=>{GI[c]=k;});
const FILL_I=FILL.map(c=>GI[c]),HOT_I=HOT.map(c=>GI[c]),EDGE_I=EDGE.map(c=>GI[c]),HASH_I=GI['#'];
let gl=null,glc,glP,glInst,glTex,glData,glU;
const GL_VS=`#version 300 es
layout(location=0) in vec2 aC;
layout(location=1) in uvec4 aD;
uniform vec2 uView,uAtl;uniform float uCell,uSW,uTile,uSpr;uniform int uCW;uniform uint uLay;uniform vec3 uInk[${BASE.length}];
out highp vec2 vUV;flat out vec4 vCol;
void main(){
  if(aD.w!=uLay||aD.z==0u){gl_Position=vec4(2.,2.,2.,1.);return;}
  int col=gl_InstanceID%uCW,row=gl_InstanceID/uCW;
  vec2 p=(vec2(col,row)+.5)*uCell-uSW*.5+aC*uSW;
  gl_Position=vec4(p.x/uView.x*2.-1.,1.-p.y/uView.y*2.,0.,1.);
  vUV=(vec2(float(aD.x)*uTile+1.,1.)+aC*uSpr)/uAtl;
  float a=float(aD.z)/255.;
  vCol=vec4(uInk[int(aD.y)]*a,a);
}`;
const GL_FS=`#version 300 es
precision highp float;
uniform sampler2D uT;in highp vec2 vUV;flat in vec4 vCol;out vec4 o;
void main(){o=vCol*texture(uT,vUV).a;}`;
function glSetup(){
  try{
    glc=document.createElement('canvas');
    gl=glc.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:false,depth:false,stencil:false});
    if(!gl)return;
    const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;};
    glP=gl.createProgram();gl.attachShader(glP,sh(gl.VERTEX_SHADER,GL_VS));gl.attachShader(glP,sh(gl.FRAGMENT_SHADER,GL_FS));gl.linkProgram(glP);
    if(!gl.getProgramParameter(glP,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(glP));
    gl.useProgram(glP);
    glU={};['uView','uAtl','uCell','uSW','uTile','uSpr','uCW','uLay','uInk','uT'].forEach(n=>{glU[n]=gl.getUniformLocation(glP,n);});
    gl.bindVertexArray(gl.createVertexArray());
    gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
    glInst=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,glInst);
    gl.enableVertexAttribArray(1);gl.vertexAttribIPointer(1,4,gl.UNSIGNED_BYTE,0,0);gl.vertexAttribDivisor(1,1);
    glTex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,glTex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.uniform1i(glU.uT,0);
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.clearColor(0,0,0,0);
    /* If the GPU context is lost, fall back to the 2D path and rebake its sprites. */
    glc.addEventListener('webglcontextlost',e=>{e.preventDefault();gl=null;baked=[-1,0,0,0];});
  }catch(e){gl=null;}
}
/* Atlas of white glyphs, one SPR tile each with a 1px clear gutter, rebuilt with the grid. */
function glGrid(){
  if(!gl)return;
  glc.width=Math.round(W*dpr);glc.height=Math.round(H*dpr);gl.viewport(0,0,glc.width,glc.height);
  const T=SPR+2,aw=T*GLYPHS.length,a=mk(aw,T),g=a.getContext('2d'),m=mk(4,4).getContext('2d');
  m.font='500 '+FS+'px '+MONO;g.fillStyle='#fff';
  GLYPHS.forEach((ch,k)=>{g.save();g.beginPath();g.rect(k*T+1,1,SPR,SPR);g.clip();g.setTransform(dpr,0,0,dpr,k*T+1,1);stampGlyph(g,m,ch);g.restore();});
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,a);
  glData=new Uint8Array(NC*4);gl.bindBuffer(gl.ARRAY_BUFFER,glInst);gl.bufferData(gl.ARRAY_BUFFER,glData.byteLength,gl.DYNAMIC_DRAW);
  gl.uniform2f(glU.uView,W,H);gl.uniform2f(glU.uAtl,aw,T);gl.uniform1f(glU.uCell,CELL);gl.uniform1f(glU.uSW,SW);
  gl.uniform1f(glU.uTile,T);gl.uniform1f(glU.uSpr,SPR);gl.uniform1i(glU.uCW,CW);
}
function glDraw(layers){
  gl.bindBuffer(gl.ARRAY_BUFFER,glInst);gl.bufferSubData(gl.ARRAY_BUFFER,0,glData);
  layers.forEach((c,lay)=>{
    gl.uniform1ui(glU.uLay,lay);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,NC);
    c.drawImage(glc,0,0,W,H);
  });
}

/* ─── the pond ─── */
function buildWorld(){
  let seed=11;const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const padDefs=[[70,60,22],[190,45,20],[300,80,24],[420,40,20],[540,70,22],[640,150,18],[30,160,16],[120,160,20],[250,180,22],[380,150,24],[470,110,16],[500,190,20],[600,260,22],[60,270,20],[180,300,24],[310,280,20],[430,300,22],[550,360,20],[90,380,18],[240,390,20],[380,390,18],[640,380,18]];
  pads=padDefs.map(([x,y,r])=>({hx:x*PX,hy:y*PY,x:x*PX,y:y*PY,vx:0,vy:0,r:r*S,n:R()*6.28,ph:R()*6,wk:R()}));

  /* Koi: a base colour, a marking colour and how much of the body it covers. */

function newPetal(x,y,z,age){return{x,y,z,vx:0,vy:0,a:Math.random()*6.28,sz:0.8+Math.random()*0.5,age:age||0,life:55+Math.random()*45,fl:Math.random()*6.28,sx:x,sy:y,fade:1};}

/* ─── water ─── */
function step(){for(let y=1;y<GH-1;y++){for(let x=1;x<GW-1;x++){const i=y*GW+x;B[i]=((A[i-1]+A[i+1]+A[i-GW]+A[i+GW])*0.5-B[i])*DAMP;}}const q=A;A=B;B=q;}
function drop(cx,cy,amt,rad){for(let y=Math.floor(cy-rad);y<=cy+rad;y++)for(let x=Math.floor(cx-rad);x<=cx+rad;x++){if(x<1||y<1||x>=GW-1||y>=GH-1)continue;const d=Math.hypot(x-cx,y-cy);if(d<=rad){const w=1-d/(rad+0.001);A[y*GW+x]+=amt*w*w*(3-2*w);}}}

const dropPx=(px,py,amt,rad)=>drop(gx(px),gy(py),amt,rad*1.5);
function vAt(px,py){
  let fx=px/sp-0.5,fy=py/sp-0.5;fx=fx<0?0:fx>GW-1.001?GW-1.001:fx;fy=fy<0?0:fy>GH-1.001?GH-1.001:fy;
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0,i=y0*GW+x0;
  return (V[i]*(1-tx)+V[i+1]*tx)*(1-ty)+(V[i+GW]*(1-tx)+V[i+GW+1]*tx)*ty;
}

/* The ripple height and its slope in x and y at one point. The slopes come from
   gradient fields worked out once a frame, which match differencing vAt one
   grid step either side; near the edge, where vAt clamps, it does exactly that. */
let VV=0,VX=0,VY=0;
function gradFrame(){
  for(let y=1;y<GH-1;y++)for(let x=1;x<GW-1;x++){const i=y*GW+x;GX[i]=V[i+1]-V[i-1];GY[i]=V[i+GW]-V[i-GW];}
}
function vAt3(px,py){
  const fx=px/sp-0.5,fy=py/sp-0.5;
  if(!(fx>=1&&fy>=1&&fx<=GW-2.001&&fy<=GH-2.001)){VV=vAt(px,py);VX=vAt(px+sp,py)-vAt(px-sp,py);VY=vAt(px,py+sp)-vAt(px,py-sp);return;}
  const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0,i=y0*GW+x0,j=i+GW,ux=1-tx,uy=1-ty;
  VV=(V[i]*ux+V[i+1]*tx)*uy+(V[j]*ux+V[j+1]*tx)*ty;
  VX=(GX[i]*ux+GX[i+1]*tx)*uy+(GX[j]*ux+GX[j+1]*tx)*ty;
  VY=(GY[i]*ux+GY[i+1]*tx)*uy+(GY[j]*ux+GY[j+1]*tx)*ty;
}

/* Breeze: patches of wind drift across the pond; inside each the surface is
   roughened into fine wavelets. Purely visual, it never feeds the ripples. */
const BREEZE={c:1,s:0,str:1,t:0,k:1,gk:1};
function breezeFrame(t){
  const a=0.42+0.3*Math.sin(t*0.021)+0.12*Math.sin(t*0.057);
  BREEZE.c=Math.cos(a);BREEZE.s=Math.sin(a);
  BREEZE.str=0.75+0.25*Math.sin(t*0.09)*Math.sin(t*0.031+1.3);
  BREEZE.t=t;BREEZE.k=2*Math.PI/(sp*4.2);BREEZE.gk=2*Math.PI/(W*0.55);
}
function breezeAt(px,py){
  const c=BREEZE.c,s=BREEZE.s,k=BREEZE.k,gk=BREEZE.gk,t=BREEZE.t;
  const u=px*c+py*s,v=-px*s+py*c,du=u-t*22*S;
  let g=Math.sin(du*gk+Math.sin(v*gk*1.3+t*0.05)*1.4)*Math.sin(v*gk*1.6-t*0.04+Math.sin(du*gk*0.7)*1.2);
  if(g<=0)return 0;g=g*g*(3-2*g)*BREEZE.str;
  if(g<0.02)return 0;
  const w=Math.sin(u*k-t*1.4+Math.sin(v*k*0.35+t*0.25)*1.6+Math.sin(v*k*0.09)*2);
  return w<=0?g*0.015:Math.min(0.11,g*(0.015+Math.pow(w,5)*0.13));
}

/* ─── shapes: each returns a brightness, or -1 for a miss ─── */
function heronShape(U,Vv,flap){
  if((U-13)**2+Vv*Vv<9)return 0.9;
  if(U>15.5&&U<24&&Math.abs(Vv)<0.3+(1-(U-15.5)/8.5))return 0.55;
  if((U/13)**2+(Vv/5)**2<1)return 0.65;
  if(U>-27&&U<-12&&Math.abs(Vv)<0.9)return 0.4;
  const span=36*(0.72+0.28*Math.cos(flap*Math.PI*2)),av=Math.abs(Vv);
  if(av>3&&av<span){const q=(av-3)/(span-3),chord=7*(1-q*0.55),uc=1-q*4;if(Math.abs(U-uc)<chord){if(q>0.8)return 0.45;return U-uc>chord*0.4?0.72:0.55;}}
  return -1;
}
function swanShape(U,Vv,flap){
  if((U-36)**2/9+Vv*Vv/5<1)return 1;
  if(U>38.5&&U<42.5&&Math.abs(Vv)<1.1)return 0.5;
  if(U>12&&U<35&&Math.abs(Vv)<1.7)return 0.95;
  if((U/15)**2+(Vv/6)**2<1)return Math.abs(Vv)<1.5?0.85:0.95;
  if(U>-20&&U<-13&&Math.abs(Vv)<(U+20)*0.8+1)return 0.85;
  const span=42*(0.7+0.3*Math.cos(flap*Math.PI*2)),av=Math.abs(Vv);
  if(av>4&&av<span){const q=(av-4)/(span-4),chord=9*(1-q*0.5),uc=2-q*3;if(Math.abs(U-uc)<chord){if(q>0.85)return 0.7;return U-uc<-chord*0.45?0.75:0.92;}}
  return -1;
}
const shadowPos=f=>({x:f.x+f.shx*S,y:f.y+f.shy*S});
function flyerBri(f,px,py,x,y,k){
  const R=f.reach*S*k;if(Math.abs(px-x)>R||Math.abs(py-y)>R)return -1;
  const dx=px-x,dy=py-y,c=Math.cos(f.a),s=Math.sin(f.a);
  return f.shape((dx*c+dy*s)/(S*k),(-dx*s+dy*c)/(S*k),f.flap);
}

/* Spatial grids: the pond is cut into square tiles and each thing is filed in
   every tile its bounding box touches, in its usual order, so a cell only tests
   the few things that could reach it. Tiles clamp at the pond's edge, which
   keeps lookups for points just outside it correct. */
function mkGrid(size){const g={s:size,w:Math.ceil(W/size)+1,h:Math.ceil(H/size)+1,c:[]};for(let k=0;k<g.w*g.h;k++)g.c.push([]);return g;}
function gFile(g,it,x0,y0,x1,y1){
  let a=Math.floor(x0/g.s),b=Math.floor(x1/g.s),c=Math.floor(y0/g.s),d=Math.floor(y1/g.s);
  a=a<0?0:a>=g.w?g.w-1:a;b=b<0?0:b>=g.w?g.w-1:b;c=c<0?0:c>=g.h?g.h-1:c;d=d<0?0:d>=g.h?g.h-1:d;
  for(let y=c;y<=d;y++)for(let x=a;x<=b;x++)g.c[y*g.w+x].push(it);
}
function gAt(g,px,py){let x=Math.floor(px/g.s),y=Math.floor(py/g.s);x=x<0?0:x>=g.w?g.w-1:x;y=y<0?0:y>=g.h?g.h-1:y;return g.c[y*g.w+x];}
const gClear=g=>{for(const l of g.c)l.length=0;};
const gFileR=(g,it,cx,cy,r)=>gFile(g,it,cx-r,cy-r,cx+r,cy+r);

/* Grass and reeds are many thin blades, filed once (padded for their sway);
   their sway is worked out once per frame. */
let gBk,rBk;
function buildBuckets(){
  const BS=24*S;gBk=mkGrid(BS);rBk=mkGrid(BS);
  const seg=(g,it,x0,y0,x1,y1,pad)=>gFile(g,it,Math.min(x0,x1)-pad,Math.min(y0,y1)-pad,Math.max(x0,x1)+pad,Math.max(y0,y1)+pad);
  banks.forEach(k=>k.blades.forEach(g=>seg(gBk,g,g.x,g.y,g.x+Math.cos(g.a)*g.len,g.y+Math.sin(g.a)*g.len,g.len*0.3+sp)));
  reeds.forEach(c=>c.blades.forEach(b=>{b.c=c;seg(rBk,b,c.x,c.y,c.x+Math.cos(b.a)*b.len,c.y+Math.sin(b.a)*b.len,b.len*0.2+sp*2.5);}));
}
function swayFrame(t){
  const gl=BREEZE.str*0.06,rl=BREEZE.str*0.035;
  banks.forEach(k=>k.blades.forEach(g=>{const a=g.a+Math.sin(t*0.8+g.ph)*0.08+Math.sin(t*1.1+g.ph*1.3)*gl;g.ex=g.x+Math.cos(a)*g.len;g.ey=g.y+Math.sin(a)*g.len;}));
  reeds.forEach(c=>c.blades.forEach(b=>{
    const sw=Math.sin(t*0.6+b.ph)*0.04+Math.sin(t*0.9+b.ph*1.7)*rl,a=b.a+sw,a2=a+sw;
    b.mx=c.x+Math.cos(a)*b.len*0.55;b.my=c.y+Math.sin(a)*b.len*0.55;b.ex=c.x+Math.cos(a2)*b.len;b.ey=c.y+Math.sin(a2)*b.len;
    b.ca=Math.cos(a2);b.sa=Math.sin(a2);b.hx=c.x+b.ca*b.len*0.82;b.hy=c.y+b.sa*b.len*0.82;}));
}
/* Static things (banks, the branch's blossoms and boughs, which are tested in
   the branch's own unswayed frame) are filed once; things that move, once a frame.
   Pebbles get a list per lattice cell of only those that can reach into it. */
let tPad,tFish,tDuck,tDfly,tBank,tBlos,tSeg,stL;
function tileInit(){
  const TS=40*S;
  tPad=mkGrid(TS);tFish=mkGrid(TS);tDuck=mkGrid(TS);tDfly=mkGrid(TS);tBank=mkGrid(TS);tBlos=mkGrid(TS);tSeg=mkGrid(TS);
  for(const k of banks)gFileR(tBank,k,k.x,k.y,k.r);
  for(const b of blossoms)gFileR(tBlos,b,b.x,b.y,b.r);
  for(const sg of brSegs)gFile(tSeg,sg,sg.minx,sg.miny,sg.maxx,sg.maxy);
  stL=[];
  for(let iy=0;iy<stny;iy++)for(let ix=0;ix<stnx;ix++){
    const l=[],x0=(ix-1)*LS,x1=ix*LS,y0=(iy-1)*LS,y1=iy*LS;
    for(let oy=-1;oy<=1;oy++){const cy=iy+oy;if(cy<0||cy>=stny)continue;
      for(let ox=-1;ox<=1;ox++){const cx=ix+ox;if(cx<0||cx>=stnx)continue;
        const k=cy*stnx+cx,r=str[k];if(!r)continue;
        if(stx[k]+r<x0||stx[k]-r>x1||sty[k]+r/1.14<y0||sty[k]-r/1.14>y1)continue;
        l.push(k);}}
    stL.push(l);}
}
function tileFrame(){
  gClear(tPad);gClear(tFish);gClear(tDuck);gClear(tDfly);
  for(const p of pads)gFileR(tPad,p,p.x,p.y,p.r);
  for(const f of fish)gFileR(tFish,f,f.x,f.y,L*f.sz*0.9);
  for(const dk of ducks){gFileR(tDuck,dk,dk.x,dk.y,DL*dk.sz);for(const c of dk.kids)gFileR(tDuck,c,c.x,c.y,DL*c.sz);}
  for(const f of dflies)gFileR(tDfly,f,f.x,f.y,12*S);
}
function grassBri(px,py,i){
  const l=gAt(gBk,px,py);
  if(l.length){const bw=sp*0.7;let best=-1;
    for(const g of l){const gd=segd(px,py,g.x,g.y,g.ex,g.ey);if(gd<bw*(1-SU*0.55)){const v=g.b*(1-SU*0.25);if(v>best)best=v;}}
    if(best>=0){gHit=1;return best;}}
  for(const k of gAt(tBank,px,py)){const d=Math.hypot(px-k.x,py-k.y);if(d<k.r){gHit=2;if(d>k.r-sp*1.1)return 0.3+tex[i]*0.08;return 0.17+tex[i]*0.1;}}
  return -1;
}
function reedBri(px,py){
  const l=gAt(rBk,px,py);if(!l.length)return -1;
  const bw=sp*0.7,hw=sp*0.9,hl=sp*1.9;let best=-1;
  for(const b of l){const c=b.c;
    if(b.cat&&segd(px,py,b.hx-b.ca*hl,b.hy-b.sa*hl,b.hx+b.ca*hl,b.hy+b.sa*hl)<hw)return 1;
    let d=segd(px,py,c.x,c.y,b.mx,b.my),q=SU*0.55;
    if(d>bw){d=segd(px,py,b.mx,b.my,b.ex,b.ey);q=0.55+SU*0.45;}
    if(d<bw*(1-q*0.45)){const v=0.5+0.25*(1-q);if(v>best)best=v;}
  }
  return best;

function duckOne(px,py,dk){

function koiAt(px,py){

    const k=S*f.sz,Lk=L*f.sz,dx=px-f.x,dy=py-f.y;if(Math.abs(dx)>Lk*0.9||Math.abs(dy)>Lk*0.9)continue;

}
function padBri(px,py){

/* ─── life ─── */
function updFlyers(dt,t){
  flyers.forEach(f=>{
    if(!f.active){f.timer-=dt;if(f.timer<=0){
      if(flyers.some(o=>o!==f&&o.active)){f.timer=4;return;}
      const m=120*S,side=Math.floor(Math.random()*4),r=()=>0.15+Math.random()*0.7;
      let p0,p1;
      if(side===0){p0={x:-m,y:H*r()};p1={x:W+m,y:H*r()};}
      else if(side===1){p0={x:W+m,y:H*r()};p1={x:-m,y:H*r()};}
      else if(side===2){p0={x:W*r(),y:-m};p1={x:W*r(),y:H+m};}
      else{p0={x:W*r(),y:H+m};p1={x:W*r(),y:-m};}
      f.p0=p0;f.p1=p1;f.len=Math.hypot(p1.x-p0.x,p1.y-p0.y);f.d=0;f.bend=(Math.random()-0.5)*0.35;f.active=true;f.flap=0;f.x=0;f.y=0;f.ph=Math.random()*6;}}
    else{
      f.d+=f.speed*S*dt;const k=f.d/f.len;
      const bx=f.p0.x+(f.p1.x-f.p0.x)*k,by=f.p0.y+(f.p1.y-f.p0.y)*k;
      const nx=-(f.p1.y-f.p0.y)/f.len,ny=(f.p1.x-f.p0.x)/f.len,off=Math.sin(k*Math.PI)*f.bend*f.len;

      if(Math.sin(t*0.45+f.ph)<0.35)f.flap+=dt*f.flapRate;else f.flap=Math.round(f.flap);

}
function nearestFood(x,y,range){let best=null,bd=range;for(const p of food){if(p.eaten)continue;const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=p;}}return best;}
function update(t,dt){

    const hx=vAt(p.x+sp,p.y)-vAt(p.x-sp,p.y),hy=vAt(p.x,p.y+sp)-vAt(p.x,p.y-sp),gust=0.6+0.4*Math.sin(t*0.3+p.ph);

      if(k>0){const l=fish[0],d=Math.hypot(l.x-f.x,l.y-f.y);if(d>230*S){want=Math.atan2(l.y-f.y,l.x-f.x);turn=0.012;}}

      else{const v=Math.min(d*0.09,5*S);f.x+=dx/d*v;f.y+=dy/d*v;f.a=turnTo(f.a,Math.atan2(dy,dx),0.3);}}
    else{f.timer-=dt;f.x+=Math.sin(t*3+f.ph)*0.15*S;f.y+=Math.cos(t*2.6+f.ph)*0.15*S;
      if(f.timer<=0){f.moving=true;f.tx=(0.12+Math.random()*0.76)*W;f.ty=(0.14+Math.random()*0.72)*H;}}
  });
  updFlyers(dt,t);
  if(mouse){mouse.mvx*=0.8;mouse.mvy*=0.8;mouse.spd*=0.86;}
}

/* ─── camera ─── */
const toWorld=(sx,sy)=>({x:cam.cx+(sx-W/2)/cam.z,y:cam.cy+(sy-H/2)/cam.z});
function clampCam(){const hw=W/(2*cam.z),hh=H/(2*cam.z);cam.cx=Math.min(Math.max(cam.cx,hw),W-hw);cam.cy=Math.min(Math.max(cam.cy,hh),H-hh);}
function zoomAt(sx,sy,nz){const w=toWorld(sx,sy);cam.anchor={sx,sy,wx:w.x,wy:w.y};cam.tz=Math.min(ZMAX,Math.max(ZMIN,nz));}
/* Movement is measured against the camera as the last frame drew it, because
   dragging and pinching move it in pointer events between frames; while it
   moves, the grid snaps instead of fading, so nothing leaves a trail. */
function camFrame(){
  if(Math.abs(cam.tz-cam.z)>1e-4)cam.z+=(cam.tz-cam.z)*0.2;else cam.z=cam.tz;
  if(cam.anchor){cam.cx=cam.anchor.wx-(cam.anchor.sx-W/2)/cam.z;cam.cy=cam.anchor.wy-(cam.anchor.sy-H/2)/cam.z;if(cam.z===cam.tz)cam.anchor=null;}
  clampCam();
  /* Parallax: the pointer tilts the view a little, and so does where the camera sits over the pond. */
  const tx=tiltX*7*S+(cam.cx-W/2)*0.035,ty=tiltY*7*S+(cam.cy-H/2)*0.035,ox=Px,oy=Py;
  Px+=(tx-Px)*0.06;Py+=(ty-Py)*0.06;
  cam.moving=Math.abs(cam.z-cam.pz)>1e-4||Math.abs(cam.cx-cam.pcx)>0.01||Math.abs(cam.cy-cam.pcy)>0.01||Math.hypot(Px-ox,Py-oy)>0.6;
  cam.pz=cam.z;cam.pcx=cam.cx;cam.pcy=cam.cy;
}

/* ─── input ─── */
const ptrs=new Map();let drag=null,pinch=null,hintGone=false;
function hideHint(){if(hintGone)return;hintGone=true;document.getElementById('hint').classList.add('is-gone');}
setTimeout(hideHint,8000);
function local(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function hoverAt(p){
  tiltX=(p.x/W-0.5)*2;tiltY=(p.y/H-0.5)*2;
  const w=toWorld(p.x,p.y),mvx=mouse?w.x-mouse.x:0,mvy=mouse?w.y-mouse.y:0,sp_=Math.hypot(mvx,mvy);
  mouse={x:w.x,y:w.y,mvx,mvy,spd:Math.max(sp_,mouse?mouse.spd:0)};
  if(!reduce)drop(gx(w.x),gy(w.y),Math.min(1.1,0.2+sp_/sp*0.25),Math.max(1.6,2.6/Math.sqrt(cam.z)));
}
function feed(w){
  drop(gx(w.x),gy(w.y),2.2,Math.max(2,3.4/Math.sqrt(cam.z)));
  for(let k=0;k<5&&food.length<40;k++){const a=Math.random()*6.28,d=(4+Math.random()*16)*S;food.push({x:w.x+Math.cos(a)*d,y:w.y+Math.sin(a)*d,vx:Math.cos(a)*0.5*S,vy:Math.sin(a)*0.5*S,age:0});}
}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);const p=local(e);ptrs.set(e.pointerId,p);hideHint();
  if(ptrs.size===2){const [a,b]=[...ptrs.values()],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2},w=toWorld(mid.x,mid.y);
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:cam.z,wx:w.x,wy:w.y};drag=null;cam.anchor=null;}
  else drag={x:p.x,y:p.y,cx:cam.cx,cy:cam.cy,moved:false};
});
cv.addEventListener('pointermove',e=>{
  const p=local(e);
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,p);
  if(pinch&&ptrs.size===2){
    const [a,b]=[...ptrs.values()],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    cam.z=cam.tz=Math.min(ZMAX,Math.max(ZMIN,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));
    cam.cx=pinch.wx-(mid.x-W/2)/cam.z;cam.cy=pinch.wy-(mid.y-H/2)/cam.z;clampCam();return;
  }
  if(drag){
    const dx=p.x-drag.x,dy=p.y-drag.y;
    if(!drag.moved&&Math.hypot(dx,dy)>5&&cam.z>1.001){drag.moved=true;cv.classList.add('is-grab');}
    if(drag.moved){cam.anchor=null;cam.cx=drag.cx-dx/cam.z;cam.cy=drag.cy-dy/cam.z;clampCam();return;}
  }
  hoverAt(p);
});
function endPtr(e){
  const p=local(e),was=drag;ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(was&&!was.moved&&ptrs.size===0&&!reduce)feed(toWorld(p.x,p.y));
  if(ptrs.size===0){drag=null;cv.classList.remove('is-grab');}
  if(e.pointerType!=='mouse')mouse=null;
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',()=>{if(!ptrs.size){mouse=null;tiltX=0;tiltY=0;}});
cv.addEventListener('wheel',e=>{e.preventDefault();hideHint();const p=local(e);zoomAt(p.x,p.y,cam.tz*Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0016)));},{passive:false});
document.getElementById('zin').onclick=()=>zoomAt(W/2,H/2,cam.tz*1.5);
document.getElementById('zout').onclick=()=>zoomAt(W/2,H/2,cam.tz/1.5);
document.getElementById('zreset').onclick=()=>zoomAt(W/2,H/2,1);
const rainBtn=document.getElementById('rain');
rainBtn.onclick=()=>{rain=!rain;rainBtn.setAttribute('aria-pressed',rain?'true':'false');};
window.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button'))return;
  if(e.key==='+'||e.key==='=')zoomAt(W/2,H/2,cam.tz*1.5);
  else if(e.key==='-'||e.key==='_')zoomAt(W/2,H/2,cam.tz/1.5);
  else if(e.key==='0')zoomAt(W/2,H/2,1);
});

/* ─── render ─── */
function render(t){
  breezeFrame(t);swayFrame(t);fileSmall();tileFrame();gradFrame();
  const act=flyers.filter(f=>f.active),shs=act.map(f=>({f,p:shadowPos(f)}));
  const rate=cam.moving?1:0,z=cam.z,cw=CELL/z;
  const dfly=smooth(0.5,0.9,wv[0]+wv[3]),RF=13*S,RFmax=9*S;
  const shx=13*S,shy=17*S;
  /* Anything that depends only on where a cell sits in the world is kept until the camera moves. */
  const ck=z+','+cam.cx+','+cam.cy,fresh=ck!==camKey;
  if(fresh){camKey=ck;NZ.fill(NaN);}
  /* The slow shimmer, sin(t/2 - (wx*.006 + wy*.004)), split into a column part and a row part. */
  for(let x=0;x<CW;x++){const wx=cam.cx+((x+0.5)*CELL-W/2)/z,a=t*0.5-wx*0.006;colW[x]=wx;colS[x]=Math.sin(a);colC[x]=Math.cos(a);}
  /* 1. sample the pond, top layer first, into each cell's brightness, ink and depth */
  for(let y=0;y<CH;y++){
    const wy=cam.cy+((y+0.5)*CELL-H/2)/z,rs=Math.sin(wy*0.004),rc=Math.cos(wy*0.004);
    for(let x=0;x<CW;x++){
      const i=y*CW+x,wx=colW[x];
      let tx;if(fresh){tx=hash(Math.floor(wx/cw),Math.floor(wy/cw));tex[i]=tx;}else tx=tex[i];
      let b=-1,lay=2,cat=0,air=true;
      for(const f of act){b=flyerBri(f,wx-Px*1.6,wy-Py*1.6,f.x,f.y,f.k);if(b>=0){cat=f.ink;break;}}
      if(b<0){b=branchAt(wx-Px*0.7,wy-Py*0.7);if(b>=0)cat=bCat;}
      if(b<0){b=smallAt(wx,wy,true);if(b>=0)cat=sCat;}
      if(b<0&&dfly>0.05){b=dflyAt(wx-Px*0.5,wy-Py*0.5);if(b>=0){cat=INK.aqua;b*=dfly;}}
      if(b<0){b=reedBri(wx-Px*0.25,wy-Py*0.25);if(b>=0)cat=b===1?INK.bark:INK.sage;}
      if(b<0){
        air=false;gHit=0;
        b=grassBri(wx,wy,i);if(b>=0)cat=gHit===1?INK.sage:INK.bank;
        if(b<0){b=duckAt(wx,wy);if(b>=0)cat=dCat;}
        if(b<0){b=smallAt(wx,wy,false);if(b>=0)cat=sCat;}
        if(b<0){b=padBri(wx,wy);if(b>=0){cat=INK.mint;b+=tx*0.06+vAt(wx,wy)*0.07;}}
        if(b<0){
          /* the water column: ripples on top, koi under them, pebbles under those */
          vAt3(wx,wy);
          const v=VV;let sx=VX,sy=VY;
          const slope=sx+sy;
          sx*=RF;sy*=RF;sx=sx>RFmax?RFmax:sx<-RFmax?-RFmax:sx;sy=sy>RFmax?RFmax:sy<-RFmax?-RFmax:sy;
          b=koiAt(wx+Px*0.5+sx,wy+Py*0.5+sy);
          if(b>=0){cat=kCat;lay=1;b=b*0.92+tx*0.03+v*0.05-slope*0.04;}
          else{
            let n=NZ[i];if(n!==n){n=vnoise(wx/(sp*2.2),wy/(sp*2.2));NZ[i]=n;}
            const bw=0.02+breezeAt(wx,wy)*1.1+n*n*n*0.1*(0.5+tx*0.9)+(v>0?v*0.3:0)+v*0.04-slope*0.12;
            const fx=wx+Px+sx*1.7,fy=wy+Py+sy*1.7;
            let bs=stoneAt(fx,fy);
            if(bs>=0){bs*=0.84+0.16*Math.sin(fx*0.011/S+t*0.22+Math.sin(fy*0.014/S+t*0.17)*2);if(padOver(fx-7*S,fy-9*S))bs*=0.5;}
            if(bs>bw){b=bs;cat=INK.stone;lay=0;}else{b=bw;cat=INK.water;lay=bw>0.15?1:0;}
          }
        }
        for(const s of shs){if(flyerBri(s.f,wx,wy,s.p.x,s.p.y,1)>=0){b*=0.4;break;}}
        if(branchAt(wx-shx,wy-shy)>=0)b*=0.62;
      }
      b*=1+0.06*(colS[x]*rc-colC[x]*rs);
      b=contrast(b<0?0:b>1?1:b);
      const d=D[i];D[i]=d+(b-d)*(rate||(b>d?RISE:FALL));LAY[i]=lay;CAT[i]=cat;
    }
  }
  /* 2. pick each cell's glyph and draw it on its layer */
  dctx.clearRect(0,0,W,H);uctx.clearRect(0,0,W,H);sctx.clearRect(0,0,W,H);
  const hs=SW/2,layers=[dctx,uctx,sctx],gainA=[0.8,1,1.08],G8=gl?glData:null;
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){
    const i=y*CW+x,b=D[i];if(b<0.04){if(G8)G8[i*4+2]=0;continue;}
    const lay=LAY[i];
    let gi=-1;
    if(lay>0&&b>0.24&&x>0&&y>0&&x<CW-1&&y<CH-1){
      const ddx=D[i+1]-D[i-1],ddy=D[i+CW]-D[i-CW];
      if(ddx*ddx+ddy*ddy>0.09&&LAY[i-1]===LAY[i+1]){let a=Math.atan2(ddy,ddx)+Math.PI/2;a=((a%Math.PI)+Math.PI)%Math.PI;gi=EDGE_I[Math.round(a/(Math.PI/4))%4];}
    }
    if(lay===0)gi=HASH_I;
    else if(gi<0){const lv=Math.min(7,Math.floor(Math.pow(b,0.85)*8));gi=lv>=5&&tex[i]>0.55?HOT_I[Math.floor(tex[i]*97)%8]:FILL_I[lv];}
    const al=Math.min(1,Math.pow(b,0.78)*gainA[lay]);
    if(G8){const o=i*4;G8[o]=gi;G8[o+1]=CAT[i];G8[o+2]=Math.round(al*255);G8[o+3]=lay;}
    else{const g=layers[lay];g.globalAlpha=al;g.drawImage(sprites[CAT[i]][GLYPHS[gi]],(x+0.5)*CELL-hs,(y+0.5)*CELL-hs,SW,SW);}
  }
  if(G8)glDraw(layers);
  /* fireflies and rain are single characters, stamped straight onto the grid */
  const ffly=smooth(0.3,0.8,wv[2]+wv[1]*0.4),halos=[];
  if(ffly>0.02)for(const f of fflies){
    const pulse=Math.pow(Math.max(0,Math.sin(t*f.pw+f.ph)),3)*ffly;if(pulse<0.04)continue;
    const wx=f.hx+Math.sin(t*f.w1+f.ph)*f.r+Math.sin(t*0.07+f.ph*2)*f.r*0.6-Px*0.6,wy=f.hy+Math.cos(t*f.w2+f.ph*1.7)*f.r*0.7-Py*0.6;
    const cx=Math.floor(((wx-cam.cx)*z+W/2)/CELL),cy=Math.floor(((wy-cam.cy)*z+H/2)/CELL);
    if(cx<0||cy<0||cx>=CW||cy>=CH)continue;
    const px=(cx+0.5)*CELL-hs,py=(cy+0.5)*CELL-hs,sf=sprites[INK.firefly];
    sctx.globalAlpha=Math.min(1,pulse*1.3);sctx.drawImage(sf[pulse>0.45?'*':'+'],px,py,SW,SW);
    sctx.globalAlpha=pulse*0.55;sctx.drawImage(sf['\u00b7'],px-CELL,py,SW,SW);sctx.drawImage(sf['\u00b7'],px+CELL,py,SW,SW);sctx.drawImage(sf['\u00b7'],px,py-CELL,SW,SW);
    uctx.globalAlpha=pulse*0.6;uctx.drawImage(sf['\u00b7'],px,py+CELL*1.5,SW,SW);
    halos.push(px+hs,py+hs,pulse);
  }
  if(rain&&!reduce)for(let k=0;k<10;k++){
    const cx=Math.floor(Math.random()*CW),cy=Math.floor(Math.random()*CH);
    sctx.globalAlpha=0.3+Math.random()*0.3;sctx.drawImage(sprites[INK.water]["'"],(cx+0.5)*CELL-hs,(cy+0.5)*CELL-hs,SW,SW);
  }
  dctx.globalAlpha=1;uctx.globalAlpha=1;sctx.globalAlpha=1;

  /* 3. composite: floor out of focus, koi and ripples soft, the surface crisp and glowing */
  const G=pal.gain;
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.drawImage(bg,0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  glowChain(deep);
  ctx.globalAlpha=0.7;ctx.drawImage(h4,0,0,W,H);
  ctx.globalAlpha=0.3;ctx.drawImage(h8,0,0,W,H);
  glowChain(under);
  ctx.globalAlpha=0.3*G;ctx.drawImage(h4,0,0,W,H);
  ctx.globalAlpha=0.22*G;ctx.drawImage(h8,0,0,W,H);
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=0.5;ctx.drawImage(h2,0,0,W,H);
  ctx.globalAlpha=0.82;ctx.drawImage(under,0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  glowChain(surf);
  ctx.globalAlpha=Math.min(1,0.4*G);ctx.drawImage(h2,0,0,W,H);
  ctx.globalAlpha=Math.min(1,0.85*G);ctx.drawImage(h4,0,0,W,H);
  ctx.globalAlpha=Math.min(1,0.75*G);ctx.drawImage(h8,0,0,W,H);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.drawImage(surf,0,0,W,H);
  if(halos.length){ctx.globalCompositeOperation='lighter';const c=pal.ink[INK.firefly].map(Math.round).join(','),R=26;
    for(let k=0;k<halos.length;k+=3){const g=ctx.createRadialGradient(halos[k],halos[k+1],0,halos[k],halos[k+1],R);
      g.addColorStop(0,'rgba('+c+','+(0.5*halos[k+2]).toFixed(3)+')');g.addColorStop(1,'rgba('+c+',0)');ctx.fillStyle=g;ctx.fillRect(halos[k]-R,halos[k+1]-R,R*2,R*2);}
    ctx.globalCompositeOperation='source-over';}
  ctx.drawImage(vign,0,0,W,H);
  drawHud();
}
function glowChain(src){
  h2c.clearRect(0,0,h2.width,h2.height);h2c.drawImage(src,0,0,h2.width,h2.height);
  h4c.clearRect(0,0,h4.width,h4.height);h4c.drawImage(h2,0,0,h4.width,h4.height);
  h8c.clearRect(0,0,h8.width,h8.height);h8c.drawImage(h4,0,0,h8.width,h8.height);
}
const zval=document.getElementById('zval');
function drawHud(){
  /* zoom meter, bottom centre: a tick rule with a needle */
  ctx.save();ctx.font='10px '+MONO;ctx.textBaseline='middle';ctx.textAlign='center';
  ctx.fillStyle='rgba(232,241,252,0.85)';ctx.strokeStyle='rgba(214,230,249,0.75)';ctx.lineWidth=1;
  const mw=Math.min(200,W*0.3),mx=W/2-mw/2,my=H-30,n=24,q=Math.log(cam.z)/Math.log(ZMAX);
  if(W>640){
    ctx.globalAlpha=0.5;ctx.beginPath();
    for(let k=0;k<=n;k++){const x=mx+mw*k/n,h=k%6===0?7:4;ctx.moveTo(x,my);ctx.lineTo(x,my-h);}
    ctx.stroke();ctx.globalAlpha=0.9;ctx.beginPath();ctx.moveTo(mx+mw*q,my+3);ctx.lineTo(mx+mw*q,my-11);ctx.stroke();
    ctx.globalAlpha=0.5;ctx.fillText('1\u00d7',mx,my+11);ctx.fillText(ZMAX+'\u00d7',mx+mw,my+11);
  }
  ctx.restore();
  if(frame%6===0)zval.textContent='\u00d7'+cam.z.toFixed(2);
}

/* ─── loop ─── */
let slow=0;
function loop(now){
  const t=now/1000,dt=Math.min(0.05,t-lastT||0.016),raw=t-lastT;lastT=t;
  camFrame();todFrame(dt);
  if(!reduce){
    update(t,dt);
    if(frame%STEP_EVERY===0)step();
    const f=(frame%STEP_EVERY+1)/STEP_EVERY;
    for(let i=0;i<N;i++)V[i]=B[i]+(A[i]-B[i])*f;
  }
  render(reduce?4:t);frame++;
  /* If frames are consistently slow, fall back to a coarser grid. */
  if(frame>90&&raw<0.2&&location.hash!=='#fixed'){slow=slow*0.97+(raw>0.03?1:0)*0.03;if(slow>0.7&&CELL<11.5){slow=0;setGrid(CELL+1.5);}}
  requestAnimationFrame(loop);
}
let rt=null;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(init,200);});
function start(){glSetup();init();if(location.hash==='#fixed')window.__pond={koi:()=>fish.map(f=>[f.x,f.y]),ducks:()=>ducks.map(d=>[d.x,d.y]),tod:m=>{todMode=m;},cam};requestAnimationFrame(loop);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(start);else start();
})();
</script>
</body>
